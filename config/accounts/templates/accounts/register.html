{% extends "base.html" %}

{% block content %}

<div style="
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
">

    <div class="card" style="width: 100%; max-width: 450px;">

        <h2 style="margin-bottom: 20px; text-align: center;">
            Create Account
        </h2>

        <p style="
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        ">
            Join us and start booking amazing stays
        </p>

        <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            {% csrf_token %}

            <input 
                type="text" 
                name="username" 
                placeholder="Username"
                required
                style="
                    padding: 12px;
                    border-radius: 8px;
                    border: 1px solid #e2e8f0;
                    font-size: 14px;
                "
            >

            <input 
                type="email" 
                name="email" 
                placeholder="Email"
                required
                style="
                    padding: 12px;
                    border-radius: 8px;
                    border: 1px solid #e2e8f0;
                    font-size: 14px;
                "
            >

            <input 
                type="password" 
                name="password" 
                placeholder="Password"
                required
                style="
                    padding: 12px;
                    border-radius: 8px;
                    border: 1px solid #e2e8f0;
                    font-size: 14px;
                "
            >

            <div>
                <label style="font-size: 14px; color: #334155;">
                    Select Role
                </label>
                <select 
                    name="role" 
                    required
                    style="
                        width: 100%;
                        margin-top: 5px;
                        padding: 12px;
                        border-radius: 8px;
                        border: 1px solid #e2e8f0;
                        font-size: 14px;
                        background: white;
                    "
                >
                    <option value="CUSTOMER">Customer</option>
                    <option value="OWNER">Owner</option>
                </select>
            </div>

            <button class="btn" type="submit" style="margin-top: 10px;">
                Register
            </button>
        </form>

        <div style="
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        ">
            Already have an account?
            <a href="{% url 'login_user' %}" 
               style="color: #2563eb; text-decoration: none;">
                Login
            </a>
        </div>

    </div>

</div>

{% endblock %}
