{% extends "base.html" %}

{% block content %}

<div style="
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
">

    <div class="card" style="width: 100%; max-width: 400px;">

        <h2 style="margin-bottom: 20px; text-align: center;">
            Welcome Back
        </h2>

        <p style="
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        ">
            Login to continue booking your stay
        </p>

        <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            {% csrf_token %}

            <input 
                type="email" 
                name="email" 
                placeholder="Email"
                required
                style="
                    padding: 12px;
                    border-radius: 8px;
                    border: 1px solid #e2e8f0;
                    font-size: 14px;
                "
            >

            <input 
                type="password" 
                name="password" 
                placeholder="Password"
                required
                style="
                    padding: 12px;
                    border-radius: 8px;
                    border: 1px solid #e2e8f0;
                    font-size: 14px;
                "
            >

            <button class="btn" type="submit" style="margin-top: 10px;">
                Login
            </button>
        </form>

        <div style="
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        ">
            Don't have an account?
            <a href="{% url 'register_user' %}" 
               style="color: #2563eb; text-decoration: none;">
                Register
            </a>
        </div>

    </div>

</div>

{% endblock %}
