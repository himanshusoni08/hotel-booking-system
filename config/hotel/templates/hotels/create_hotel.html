{% extends "base.html" %}

{% block content %}

<style>
    .hotel-form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }

    .hotel-form-card {
        width: 100%;
        max-width: 500px;
        padding: 25px;
        border-radius: 12px;
        background: white;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .hotel-form-card h2 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 24px;
        color: #1e293b;
    }

    .hotel-form-card form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .hotel-form-card label {
        font-size: 14px;
        color: #334155;
        margin-bottom: 5px;
    }

    .hotel-form-card input[type="text"],
    .hotel-form-card textarea,
    .hotel-form-card input[type="file"] {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        font-size: 14px;
    }

    .hotel-form-card textarea {
        resize: vertical;
    }

    .hotel-form-card .btn {
        background: #2563eb;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        transition: background 0.2s ease;
    }

    .hotel-form-card .btn:hover {
        background: #1d4ed8;
    }

    /* Messages */
    .message {
        padding: 12px;
        border-radius: 5px;
        margin-bottom: 15px;
        font-size: 14px;
    }

    .message.success {
        background: #dcfce7;
        color: #166534;
    }

    .message.error {
        background: #fee2e2;
        color: #991b1b;
    }
</style>

<div class="hotel-form-container">
    <div class="hotel-form-card">
        <h2>Create Hotel</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div>
                <label for="name">Hotel Name</label>
                <input type="text" name="name" id="name" required>
            </div>

            <div>
                <label for="location">Location</label>
                <input type="text" name="location" id="location" required>
            </div>

            <div>
                <label for="description">Description</label>
                <textarea name="description" id="description" rows="4" required></textarea>
            </div>

            <div>
                <label for="image">Image</label>
                <input type="file" name="image" id="image">
            </div>

            <button type="submit" class="btn">Create Hotel</button>
        </form>
    </div>
</div>

{% endblock %}
