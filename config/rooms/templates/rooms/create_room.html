{% extends "base.html" %}

{% block content %}

<style>
    .room-form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }

    .room-form-card {
        width: 100%;
        max-width: 450px;
        padding: 25px;
        border-radius: 12px;
        background: white;
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .room-form-card h2 {
        text-align: center;
        color: #1e293b;
        margin-bottom: 20px;
        font-size: 24px;
    }

    .room-form-card form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .room-form-card input,
    .room-form-card select {
        width: 100%;
        padding: 12px;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
    }

    .room-form-card button {
        background: #2563eb;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .room-form-card button:hover {
        background: #1d4ed8;
    }

    /* Messages */
    .message {
        padding: 12px;
        border-radius: 5px;
        font-size: 14px;
        margin-bottom: 15px;
    }

    .message.success {
        background: #dcfce7;
        color: #166534;
    }

    .message.error {
        background: #fee2e2;
        color: #991b1b;
    }
</style>

<div class="room-form-container">
    <div class="room-form-card">
        <h2>Add Room to "{{ hotel.name }}"</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="message success">{{ success }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div>
                <label for="room_number">Room Number</label>
                <input type="text" name="room_number" id="room_number" placeholder="Room Number" required>
            </div>

            <div>
                <label for="room_type">Room Type</label>
                <select name="room_type" id="room_type" required>
                    <option value="SINGLE">Single</option>
                    <option value="DOUBLE">Double</option>
                    <option value="DELUXE">Deluxe</option>
                </select>
            </div>

            <div>
                <label for="price">Price (₹)</label>
                <input type="number" name="price" id="price" placeholder="Price" required>
            </div>

            <button type="submit">Create Room</button>
        </form>
    </div>
</div>

{% endblock %}
